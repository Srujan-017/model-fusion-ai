services:
  - type: web
    name: modelfusion-ai-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: GITHUB_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
